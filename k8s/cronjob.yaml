apiVersion: batch/v1
kind: CronJob
metadata:
  name: waldur-grafana-sync
spec:
  schedule: 10 * * * *
  concurrencyPolicy: Allow
  selector:
    matchLabels:
      app: waldur-grafana-sync
  template:
    metadata:
      labels:
        app: waldur-grafana-sync
    spec:
      containers:
        - name: waldur-grafana-sync
          image: registry.hpc.ut.ee/mirror/opennode/waldur-grafana-sync:latest
          imagePullPolicy: Always
          env:
            - name: BACKEND_API_URL
              value: https://puhuri-stats.neic.no/
            - name: BACKEND_API_USER
              value: waldur-integration-user
            - name: PROTECTED_TEAMS
              value: Development,Management,Puhuri team,LUMI CSC, LUMI OMB
            - name: DATASOURCE_UID
              value: DSjDRl44k
            - name: DATASOURCE_METRICS_UID
              value: c3ccb564-2d60-4894-86cf-6c5a2794743a
            - name: PROMETHEUS_UID
              value: Jjw7caQ7k
            - name: PROTECTED_FOLDERS
              value: Development,Delta office,EuroFP Demo,CSC OMB
            - name: DRY_RUN
              value: "false"
            - name: BACKEND_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waldur-grafana-sync-secret
                  key: BACKEND_API_PASSWORD
            - name: WALDUR_API_URL
              value: https://puhuri-core.neic.no/api/
            - name: WALDUR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: waldur-grafana-sync-secret
                  key: WALDUR_API_TOKEN
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
